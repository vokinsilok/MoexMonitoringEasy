services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moex_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      TBANK_INVEST_TOKEN: ${TBANK_INVEST_TOKEN}
      TBANK_INVEST_BASE_URL: ${TBANK_INVEST_BASE_URL}
      TBANK_INVEST_TIMEOUT_SECONDS: ${TBANK_INVEST_TIMEOUT_SECONDS}
      TBANK_INVEST_SSL_VERIFY: ${TBANK_INVEST_SSL_VERIFY}
      TBANK_INVEST_CA_BUNDLE_PATH: ${TBANK_INVEST_CA_BUNDLE_PATH}
      TASKIQ_QUEUE_NAME: ${TASKIQ_QUEUE_NAME}
      TBANK_SYNC_INTERVAL_SECONDS: ${TBANK_SYNC_INTERVAL_SECONDS:-120}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: bot_service/Dockerfile
    container_name: moex_bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BACKEND_API_BASE_URL: ${BACKEND_API_BASE_URL:-http://backend:8000}
      BACKEND_API_TIMEOUT_SECONDS: ${BACKEND_API_TIMEOUT_SECONDS:-20}
    depends_on:
      backend:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moex_worker
    restart: unless-stopped
    command: ["taskiq", "worker", "src.tasks.broker:broker", "src.moduls.tbank.tasks"]
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      TBANK_INVEST_TOKEN: ${TBANK_INVEST_TOKEN}
      TBANK_INVEST_BASE_URL: ${TBANK_INVEST_BASE_URL}
      TBANK_INVEST_TIMEOUT_SECONDS: ${TBANK_INVEST_TIMEOUT_SECONDS}
      TBANK_INVEST_SSL_VERIFY: ${TBANK_INVEST_SSL_VERIFY}
      TBANK_INVEST_CA_BUNDLE_PATH: ${TBANK_INVEST_CA_BUNDLE_PATH}
      TASKIQ_QUEUE_NAME: ${TASKIQ_QUEUE_NAME}
      TBANK_SYNC_INTERVAL_SECONDS: ${TBANK_SYNC_INTERVAL_SECONDS:-120}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: moex_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: moex_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
